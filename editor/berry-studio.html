<title>Berry Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=DM+Serif+Display:ital@1&family=Playfair+Display:ital@1&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: mesa de montaje — vista previa vertical fija a la izquierda, línea de planos editable a la derecha (se apila en iPad vertical y móvil) */
:root{
  --carbon:#111111; --roto:#F4F1EC; --arena:#D8C3A5; --selva:#4A5A3C; --sol:#E8C547;
  --bg:#F4F1EC; --panel:#FFFFFF; --fg:#111111; --muted:#6B6760; --line:#DDD6CA; --field:#FAF8F4;
  --accent:#4A5A3C; --accent-fg:#F4F1EC; --warn:#9A6B12; --ok:#3E5A2E;
  --display:"Archivo","Archivo Black","Arial Black",sans-serif;
  --serie:"DM Serif Display",Georgia,serif;
  --acento:"Playfair Display",Georgia,serif;
  --ui:"Inter","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111111; --panel:#1A1A19; --fg:#F4F1EC; --muted:#A9A296; --line:#2E2D2A; --field:#141413;
  --accent:#D8C3A5; --accent-fg:#111111; --warn:#E8C547; --ok:#A9BC8E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111111; --panel:#1A1A19; --fg:#F4F1EC; --muted:#A9A296; --line:#2E2D2A; --field:#141413;
  --accent:#D8C3A5; --accent-fg:#111111; --warn:#E8C547; --ok:#A9BC8E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}
.brand{font-family:var(--serie);font-style:italic;font-size:44px;line-height:1;margin:0}
.brand small{display:block;font-family:var(--ui);font-style:normal;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:8px}
select,input,textarea,button{font:inherit;color:inherit}
.ep-select{background:var(--panel);border:1px solid var(--line);padding:8px 12px;min-width:240px;max-width:100%}
.grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.preview{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:grid;gap:12px}
@media (max-width:820px){.preview{position:static;max-width:340px;margin:0 auto;width:100%}}
.phone{aspect-ratio:9/16;max-width:100%;background:var(--carbon);overflow:hidden;position:relative;border:1px solid var(--line)}
.phone video{width:100%;height:100%;object-fit:cover;display:block}
.phone .empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#A9A296;padding:24px;font-size:14px}
.ver{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border:1px solid currentColor}
.pill.listo{color:var(--ok)} .pill.pedido{color:var(--warn)} .pill.render{color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);padding:20px}
.card h2{font-family:var(--display);font-stretch:125%;font-weight:850;text-transform:uppercase;font-size:18px;letter-spacing:.01em;margin:0 0 14px}
.stack{display:grid;gap:20px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:520px){.fields{grid-template-columns:1fr}}
label{display:grid;gap:6px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=number],textarea{background:var(--field);border:1px solid var(--line);padding:9px 10px;width:100%;font-size:15px;letter-spacing:0;text-transform:none;font-weight:400;color:var(--fg)}
input[type=range]{width:100%;accent-color:var(--accent)}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.serie-prev{font-family:var(--serie);font-style:italic;font-size:30px;line-height:1;text-transform:none;letter-spacing:0;color:var(--fg)}
.ep-prev{font-family:var(--acento);font-style:italic;font-size:17px;text-transform:none;letter-spacing:0;color:var(--muted)}
.timeline-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.timeline-head h2{margin:0}
.total{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.total b{color:var(--fg);font-size:18px}
.bar{display:flex;height:8px;margin-bottom:18px;gap:2px}
.bar div{background:var(--arena);min-width:3px}
.bar div.off{background:var(--line)}
.planos{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.plano{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:14px;align-items:start;border:1px solid var(--line);padding:12px;background:var(--field)}
.plano.off{opacity:.45}
.thumb{width:72px;aspect-ratio:9/16;background:var(--carbon);overflow:hidden;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .n{position:absolute;top:4px;left:4px;font:600 11px var(--ui);color:#fff;background:rgba(17,17,17,.6);padding:1px 5px;font-variant-numeric:tabular-nums}
.pbody{display:grid;gap:10px;min-width:0}
.pmeta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.times{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.times label{font-size:11px}
.times .dur{align-self:end;padding:9px 0;font-size:14px;font-variant-numeric:tabular-nums;color:var(--fg);text-transform:none;letter-spacing:0;font-weight:500}
.tools{display:grid;gap:6px}
.ib{border:1px solid var(--line);background:var(--panel);width:36px;height:36px;display:grid;place-items:center;cursor:pointer;font-size:16px;line-height:1}
.ib:hover{border-color:var(--fg)}
.ib:disabled{opacity:.35;cursor:default}
.add{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.add select{background:var(--panel);border:1px solid var(--line);padding:8px 10px;max-width:100%}
.btn{border:1px solid var(--fg);background:transparent;padding:10px 16px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.msg{font-size:14px;color:var(--muted);min-height:1.5em}
.note{font-size:13px;color:var(--muted)}
.pending{border-left:3px solid var(--warn);padding:10px 14px;background:var(--field);font-size:14px}
.loading{padding:48px 0;color:var(--muted)}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:4px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 16px;cursor:pointer;font-family:var(--display);font-stretch:125%;font-weight:850;text-transform:uppercase;font-size:14px;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.feed{list-style:none;margin:0;padding:0;display:grid;gap:0}
.step{display:grid;grid-template-columns:28px minmax(0,1fr);gap:14px;padding-bottom:22px;position:relative}
.step::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--accent);display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--panel);font-variant-numeric:tabular-nums}
.step.done .dot{background:var(--accent);color:var(--accent-fg)}
.step.live .dot{border-color:var(--warn);color:var(--warn)}
@media (prefers-reduced-motion:no-preference){.step.live .dot{animation:pulse 1.4s ease-in-out infinite}}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--warn) 25%,transparent)}}
.sbody{min-width:0;display:grid;gap:6px}
.sfase{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stitle{font-weight:600;font-size:16px}
.sdet{font-size:14px;color:var(--fg);white-space:pre-line}
.simg{overflow-x:auto;border:1px solid var(--line);background:var(--carbon)}
.simg img{display:block;max-width:none;height:150px}
.simg.tall img{height:auto;max-width:100%}
.shora{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){.ib,.btn{transition:border-color .15s,background .15s}}
</style>

<div class="wrap">
  <header>
    <h1 class="brand">berry studio<small>Tu editor de vídeo · identidad Bali en crudo</small></h1>
    <label for="ep">Episodio
      <select id="ep" class="ep-select"><option>Cargando…</option></select>
    </label>
  </header>

  <div id="app" class="loading">Cargando tus montajes…</div>
</div>

<script>
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => (Math.round(n*10)/10).toFixed(1);
let db = null, episodes = [], current = null, draft = null, dirty = false, saving = false, unsub = null;
let tab = "proceso", pasos = [];

function renderProceso(){
  const mine = pasos.filter(p => p.ep === current).sort((a,b) => (a.orden||0) - (b.orden||0));
  if(!mine.length) return `<div class="card"><p class="note">Aquí verás cada paso del montaje mientras Claude trabaja: qué clips descarga, qué fotogramas mira, qué repetición elige y por qué.</p></div>`;
  return `<div class="card"><ol class="feed">${mine.map((p,i) => `
    <li class="step ${p.estado==="en curso"?"live":"done"}">
      <span class="dot">${p.estado==="en curso"?"…":i+1}</span>
      <div class="sbody">
        <span class="sfase">${esc(p.fase||"")}${p.version?` · versión ${esc(p.version)}`:""}</span>
        <span class="stitle">${esc(p.titulo)}</span>
        ${p.detalle?`<span class="sdet">${esc(p.detalle)}</span>`:""}
        ${p.img?`<div class="simg ${p.alto?"tall":""}"><img src="${esc(p.img)}" alt="${esc(p.titulo)}" loading="lazy"></div>`:""}
        ${p.hora?`<span class="shora">${esc(new Date(p.hora).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}))}</span>`:""}
      </div>
    </li>`).join("")}</ol></div>`;
}

const app = $("#app"), sel = $("#ep");

function totalDur(p){ return p.filter(x=>x.activo!==false).reduce((a,x)=>a+Math.max(0,x.hasta-x.desde),0); }

function render(){
  if(!draft){ return; }
  const d = draft, planos = d.planos || [];
  const total = totalDur(planos);
  const estado = d.estado || "listo";
  const pillCls = estado==="cambios_pedidos" ? "pedido" : estado==="renderizando" ? "render" : "listo";
  const pillTxt = estado==="cambios_pedidos" ? "Cambios enviados a Claude" : estado==="renderizando" ? "Claude está montando" : "Versión lista";
  const clips = d.clips || [];
  app.className = "";
  app.innerHTML = `
  <div class="grid">
    <aside class="preview">
      <div class="phone">${d.video_url
        ? `<video src="${esc(d.video_url)}" controls playsinline preload="metadata" poster="${esc(d.poster_url||"")}"></video>`
        : `<div class="empty">Aquí aparecerá el vídeo cuando Claude lo monte.</div>`}</div>
      <div class="ver"><span>Versión ${esc(d.version||1)} · ${fmt(d.video_dur||total)} s</span><span class="pill ${pillCls}">${pillTxt}</span></div>
      ${d.pendiente ? `<div class="pending"><b>Falta:</b> ${esc(d.pendiente)}</div>` : ""}
    </aside>

    <section class="stack">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" aria-selected="${tab==="proceso"}" data-act="tab" data-tab="proceso">Proceso de edición</button>
        <button class="tab" role="tab" aria-selected="${tab==="ajustes"}" data-act="tab" data-tab="ajustes">Planos y ajustes</button>
      </div>
      ${tab==="proceso" ? renderProceso() : `
      <div class="card">
        <h2>Título</h2>
        <div class="fields">
          <label for="f-serie">Serie <input id="f-serie" type="text" value="${esc(d.serie)}" data-k="serie"></label>
          <label for="f-ep">Episodio <input id="f-ep" type="text" value="${esc(d.episodio)}" data-k="episodio"></label>
          <label for="f-td">Segundos con título <input id="f-td" type="number" min="1" max="6" step="0.1" value="${esc(d.titulo_duracion)}" data-k="titulo_duracion" data-num></label>
          <div style="display:grid;gap:2px;align-content:end"><span class="serie-prev">${esc(d.serie)}</span><span class="ep-prev">${esc(d.episodio)}</span></div>
        </div>
      </div>

      <div class="card">
        <div class="timeline-head"><h2>Planos</h2><span class="total">Duración <b>${fmt(total)} s</b> · objetivo 30–50 s</span></div>
        <div class="bar" aria-hidden="true">${planos.map(p=>`<div class="${p.activo===false?"off":""}" style="flex:${Math.max(.2,p.hasta-p.desde)}"></div>`).join("")}</div>
        <ol class="planos">
          ${planos.map((p,i)=>`
          <li class="plano ${p.activo===false?"off":""}">
            <div class="thumb">${p.thumb?`<img src="${esc(p.thumb)}" alt="Fotograma del plano ${i+1}">`:""}<span class="n">${i+1}</span></div>
            <div class="pbody">
              <div class="pmeta">${esc(p.clip)}${p.nota?` · ${esc(p.nota)}`:""}</div>
              <label for="t-${i}">Texto en pantalla
                <input id="t-${i}" type="text" value="${esc(p.texto)}" placeholder="Sin texto" data-i="${i}" data-pk="texto"></label>
              <div class="times">
                <label for="d-${i}">Desde (s)<input id="d-${i}" type="number" step="0.1" min="0" value="${esc(p.desde)}" data-i="${i}" data-pk="desde" data-num></label>
                <label for="h-${i}">Hasta (s)<input id="h-${i}" type="number" step="0.1" min="0" value="${esc(p.hasta)}" data-i="${i}" data-pk="hasta" data-num></label>
                <span class="dur">${fmt(p.hasta-p.desde)} s</span>
              </div>
            </div>
            <div class="tools">
              <button class="ib" data-act="up" data-i="${i}" ${i===0?"disabled":""} aria-label="Subir plano ${i+1}">↑</button>
              <button class="ib" data-act="down" data-i="${i}" ${i===planos.length-1?"disabled":""} aria-label="Bajar plano ${i+1}">↓</button>
              <button class="ib" data-act="toggle" data-i="${i}" aria-label="${p.activo===false?"Volver a usar":"Quitar"} plano ${i+1}">${p.activo===false?"＋":"✕"}</button>
            </div>
          </li>`).join("")}
        </ol>
        ${clips.length?`<div class="add">
          <select id="addclip" aria-label="Clip para añadir">${clips.map((c,i)=>`<option value="${i}">${esc(c.nombre)}${c.ejercicio?` · ${esc(c.ejercicio)}`:""} (${fmt(c.dur||0)} s)</option>`).join("")}</select>
          <button class="btn" data-act="add">Añadir plano</button></div>`:""}
        <p class="note">Los tiempos son segundos dentro del clip original. Un plano quitado se queda gris y no sale en el vídeo.</p>
      </div>

      <div class="card">
        <h2>Sonido y color</h2>
        <div class="fields">
          <label for="f-vol">Sonido del gym · ${Math.round((d.audio_ambiente??0.25)*100)} %
            <input id="f-vol" type="range" min="0" max="1" step="0.05" value="${esc(d.audio_ambiente??0.25)}" data-k="audio_ambiente" data-num></label>
          <label for="f-cal">Calidez · ${["neutro","suave","Berry Cálido","muy cálido"][d.calidez??2]}
            <input id="f-cal" type="range" min="0" max="3" step="1" value="${esc(d.calidez??2)}" data-k="calidez" data-num></label>
        </div>
      </div>

      <div class="card">
        <h2>Notas para Claude</h2>
        <label for="f-notas" style="text-transform:none;letter-spacing:0;font-size:14px;font-weight:400">Todo lo que no puedas cambiar arriba: «empieza por el squat», «textos más grandes», «corta la risa del final»…
          <textarea id="f-notas" rows="4" data-k="notas">${esc(d.notas||"")}</textarea></label>
        <div class="actions" style="margin-top:14px">
          <button class="btn" data-act="save" ${saving?"disabled":""}>Guardar</button>
          <button class="btn primary" data-act="send" ${saving?"disabled":""}>Guardar y pedir nueva versión</button>
          <span class="msg" id="msg" role="status">${dirty?"Cambios sin guardar":""}</span>
        </div>
        <p class="note">Después dile a Claude en el chat «ya está» y montará la versión ${(d.version||1)+1} con tus cambios.</p>
      </div>`}
    </section>
  </div>`;
}

app.addEventListener("input", e => {
  const t = e.target; if(!draft) return;
  const v = t.hasAttribute("data-num") ? parseFloat(t.value) : t.value;
  if(t.dataset.k){ draft[t.dataset.k] = (t.hasAttribute("data-num") && isNaN(v)) ? draft[t.dataset.k] : v; }
  else if(t.dataset.pk){ const p = draft.planos[+t.dataset.i]; if(!(t.hasAttribute("data-num") && isNaN(v))) p[t.dataset.pk] = v; }
  dirty = true; const m = $("#msg"); if(m) m.textContent = "Cambios sin guardar";
  if(t.type === "range" || t.dataset.pk === "desde" || t.dataset.pk === "hasta" || t.dataset.k === "serie" || t.dataset.k === "episodio"){
    // re-render cheap parts without losing focus on text fields
    if(t.type === "range"){ const pos = t.id; render(); const el = document.getElementById(pos); el && el.focus(); }
    else { const dur = t.closest(".plano")?.querySelector(".dur"); if(dur){ const p = draft.planos[+t.dataset.i]; dur.textContent = fmt(p.hasta-p.desde)+" s"; }
      const tot = $(".total b"); if(tot) tot.textContent = fmt(totalDur(draft.planos))+" s";
      if(t.dataset.k){ $(".serie-prev").textContent = draft.serie; $(".ep-prev").textContent = draft.episodio; } }
  }
});

app.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if(!b || !draft) return;
  const i = +b.dataset.i, P = draft.planos, act = b.dataset.act;
  if(act==="tab"){ tab = b.dataset.tab; render(); return; }
  if(act==="up" && i>0){ [P[i-1],P[i]]=[P[i],P[i-1]]; dirty=true; render(); }
  else if(act==="down" && i<P.length-1){ [P[i+1],P[i]]=[P[i],P[i+1]]; dirty=true; render(); }
  else if(act==="toggle"){ P[i].activo = P[i].activo===false; dirty=true; render(); }
  else if(act==="add"){ const c = draft.clips[+$("#addclip").value]; P.push({clip:c.nombre, desde:0, hasta:Math.min(3,c.dur||3), texto:"", thumb:c.thumb||"", activo:true}); dirty=true; render(); }
  else if(act==="save" || act==="send"){ await save(act==="send"); }
});

async function save(request){
  if(!db || !current){ return; }
  saving = true; render();
  const m = () => $("#msg");
  try{
    const data = {serie:draft.serie, episodio:draft.episodio, titulo_duracion:draft.titulo_duracion,
      audio_ambiente:draft.audio_ambiente, calidez:draft.calidez??2, notas:draft.notas||"", planos:draft.planos,
      actualizado:new Date().toISOString()};
    if(request) data.estado = "cambios_pedidos";
    await db.doc("episodios/"+current).update(data);
    dirty = false; saving = false;
    Object.assign(draft, data); render();
    m().textContent = request ? "Enviado. Dile a Claude «ya está» en el chat." : "Guardado.";
  }catch(err){
    saving = false; render();
    m().textContent = err?.code==="not_granted" ? "No tienes permiso para editar este montaje." : "No se ha podido guardar. Vuelve a intentarlo.";
  }
}

function pick(id){
  current = id;
  const ep = episodes.find(x=>x.id===id);
  draft = ep ? JSON.parse(JSON.stringify(ep.data)) : null;
  dirty = false; render();
}

(async () => {
  const timer = setTimeout(() => { if(!episodes.length) app.innerHTML = `<p class="loading">No se han podido cargar los montajes. Abre la página de nuevo en un momento.</p>`; }, 10000);
  db = await (window.claude?.use ? window.claude.use("db") : null);
  if(!db){ clearTimeout(timer); app.innerHTML = `<p class="loading">Inicia sesión en claude.ai para ver y editar tus montajes.</p>`; return; }
  db.collection("proceso").onSnapshot(snap => {
    pasos = snap.docs.map(d => d.data());
    if(draft && tab === "proceso") render();
  }, () => {});
  db.collection("episodios").onSnapshot(snap => {
    clearTimeout(timer);
    episodes = snap.docs.map(d=>({id:d.id, data:d.data()})).sort((a,b)=>String(b.id).localeCompare(String(a.id)));
    if(!episodes.length){ sel.innerHTML = "<option>Sin episodios</option>"; app.innerHTML = `<p class="loading">Todavía no hay montajes. Cuando Claude monte tu primer vídeo aparecerá aquí.</p>`; return; }
    sel.innerHTML = episodes.map(e=>`<option value="${esc(e.id)}">${esc(e.data.serie)} · ${esc(e.data.episodio)}</option>`).join("");
    if(!current || !episodes.some(e=>e.id===current)) current = episodes[0].id;
    sel.value = current;
    if(!dirty) pick(current);
    else { // keep her edits, but refresh video/estado from Claude
      const ep = episodes.find(x=>x.id===current).data;
      ["video_url","poster_url","version","video_dur","estado","pendiente","clips"].forEach(k=>draft[k]=ep[k]); render();
    }
  }, () => { clearTimeout(timer); app.innerHTML = `<p class="loading">No se han podido cargar los montajes. Abre la página de nuevo en un momento.</p>`; });
})();
sel.addEventListener("change", () => pick(sel.value));
</script>
